<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCANNA by Umi - AI Powered</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .ai-glow { box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- KONFIGURASI API (MANDATORY) ---
        const CLIENT_ID = "1060242803873-93257k5p0epj93dg07ll7oanc3cofm81.apps.googleusercontent.com"; // Masukkan Client ID Anda
        const API_KEY = "AIzaSyBCwRn0uVC9H8Tz3MLLANByQwkErABjkqk";   // Masukkan API Key Anda (Google Cloud API Key)
        const geminiKey = ""; // Kosongkan, lingkungan akan menyediakan secara otomatis
        
        const SCOPES = "https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/spreadsheets";

        // Koordinat Fallback untuk Mode Standar
        const OMR_MAP = {
            rollNo: { x: 33.6, y: 32.2, w: 11.2, h: 21.5, cols: 4, rows: 10 },
            sections: [
                { id: 'L1', start: 1, end: 5, x: 33.6, y: 57.5, w: 11.2, h: 8.8, cols: 5, rows: 5 },
                { id: 'L2', start: 6, end: 10, x: 33.6, y: 68.8, w: 11.2, h: 8.8, cols: 5, rows: 5 },
                { id: 'L3', start: 11, end: 14, x: 33.6, y: 79.8, w: 11.2, h: 7.0, cols: 5, rows: 4 },
                { id: 'R1', start: 15, end: 20, x: 58.6, y: 17.5, w: 11.2, h: 10.8, cols: 5, rows: 6 },
                { id: 'R2', start: 21, end: 25, x: 58.6, y: 31.8, w: 11.2, h: 8.8, cols: 5, rows: 5 },
                { id: 'R3', start: 26, end: 30, x: 58.6, y: 46.5, w: 11.2, h: 8.8, cols: 5, rows: 5 },
                { id: 'R4', start: 31, end: 35, x: 58.6, y: 61.5, w: 11.2, h: 8.8, cols: 5, rows: 5 },
                { id: 'R5', start: 36, end: 40, x: 58.6, y: 76.8, w: 11.2, h: 8.8, cols: 5, rows: 5 }
            ]
        };

        const App = () => {
            const [token, setToken] = useState(null);
            const [activeTab, setActiveTab] = useState('cloud');
            const [scanMode, setScanMode] = useState('standard'); // 'standard' or 'ai'
            const [folderId, setFolderId] = useState(localStorage.getItem('umi_folder') || "");
            const [sheetId, setSheetId] = useState(localStorage.getItem('umi_sheet') || "");
            const [files, setFiles] = useState([]);
            const [results, setResults] = useState([]);
            const [kunci, setKunci] = useState(JSON.parse(localStorage.getItem('umi_kunci')) || Array(40).fill(''));
            const [siswaDB, setSiswaDB] = useState(JSON.parse(localStorage.getItem('umi_siswa')) || []);
            const [loading, setLoading] = useState(false);
            const [progress, setProgress] = useState(0);

            useEffect(() => {
                const gsi = document.createElement("script");
                gsi.src = "https://accounts.google.com/gsi/client";
                gsi.async = true;
                document.body.appendChild(gsi);

                const gapi = document.createElement("script");
                gapi.src = "https://apis.google.com/js/api.js";
                gapi.onload = () => {
                    window.gapi.load('client', () => {
                        window.gapi.client.init({ apiKey: API_KEY, discoveryDocs: ["https://sheets.googleapis.com/$discovery/rest?version=v4"] });
                    });
                };
                document.body.appendChild(gapi);
            }, []);

            const handleLogin = () => {
                const client = window.google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: SCOPES,
                    callback: (res) => { if (res.access_token) setToken(res.access_token); }
                });
                client.requestAccessToken();
            };

            const fetchFiles = async () => {
                if(!token || !folderId) return;
                setLoading(true);
                try {
                    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+mimeType+contains+'image/'&fields=files(id,name)&access_token=${token}`);
                    const data = await res.json();
                    setFiles(data.files || []);
                    localStorage.setItem('umi_folder', folderId);
                    localStorage.setItem('umi_sheet', sheetId);
                } catch(e) { alert("Gagal memuat Drive. Cek ID Folder."); }
                setLoading(false);
            };

            const blobToBase64 = (blob) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            };

            // --- FUNGSI AI OMR (Presisi Tinggi) ---
            const analyzeWithAI = async (fileId) => {
                const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const blob = await resp.blob();
                const base64Data = await blobToBase64(blob);

                const prompt = `Analisis lembar LJK ini. Tolong identifikasi: 
                1. Roll No (Nomor Ujian 4 digit yang diarsir).
                2. Jawaban untuk soal nomor 1 sampai 40 (A, B, C, D, atau E). Jika tidak diarsir beri "-".
                Format respon harus JSON murni:
                { "rollNo": "string", "answers": ["A", "B", ...] }`;

                const callGemini = async (retries = 0) => {
                    try {
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${geminiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: prompt },
                                        { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                                    ]
                                }],
                                generationConfig: { responseMimeType: "application/json" }
                            })
                        });
                        const data = await res.json();
                        return JSON.parse(data.candidates[0].content.parts[0].text);
                    } catch (err) {
                        if (retries < 5) {
                            await new Promise(r => setTimeout(r, Math.pow(2, retries) * 1000));
                            return callGemini(retries + 1);
                        }
                        throw err;
                    }
                };

                const result = await callGemini();
                let benar = 0;
                result.answers.forEach((ans, i) => { if(ans === kunci[i] && kunci[i] !== '') benar++; });
                const siswa = siswaDB.find(s => s.kode === result.rollNo) || { nama: "Tidak Dikenal", kode: result.rollNo };

                return { kode: result.rollNo, nama: siswa.nama, benar, skor: ((benar / kunci.filter(k=>k!=='').length) * 100).toFixed(1), jawaban: result.answers };
            };

            // --- FUNGSI STANDAR OMR (Cepat) ---
            const analyzeStandard = async (fileId) => {
                const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const blob = await resp.blob();
                const bitmap = await createImageBitmap(blob);
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                canvas.width = 1200; 
                canvas.height = 1697;
                ctx.drawImage(bitmap, 0, 0, 1200, 1697);

                const getBrightness = (x, y, w, h) => {
                    const data = ctx.getImageData(x, y, w, h).data;
                    let sum = 0;
                    for (let i = 0; i < data.length; i += 4) sum += (data[i] + data[i+1] + data[i+2]) / 3;
                    return sum / (w * h);
                };

                // Scan Roll No
                let rollNo = "";
                const rn = OMR_MAP.rollNo;
                const rnCellW = (rn.w * 1200 / 100) / rn.cols;
                const rnCellH = (rn.h * 1697 / 100) / rn.rows;
                const rnStartX = (rn.x * 1200 / 100);
                const rnStartY = (rn.y * 1697 / 100);

                for (let c = 0; c < rn.cols; c++) {
                    let darkest = -1; let minB = 255; let list = [];
                    for (let r = 0; r < rn.rows; r++) {
                        const b = getBrightness(rnStartX + (c * rnCellW), rnStartY + (r * rnCellH), rnCellW * 0.8, rnCellH * 0.8);
                        list.push(b);
                        if (b < minB) { minB = b; darkest = r; }
                    }
                    if ((list.reduce((a,b)=>a+b, 0)/rn.rows) - minB > 25) rollNo += darkest.toString();
                    else rollNo += "?";
                }

                // Scan Jawaban
                const answers = Array(40).fill('');
                OMR_MAP.sections.forEach(sec => {
                    const secCellW = (sec.w * 1200 / 100) / sec.cols;
                    const secCellH = (sec.h * 1697 / 100) / sec.rows;
                    for (let r = 0; r < sec.rows; r++) {
                        const qIdx = sec.start + r - 1;
                        if (qIdx >= 40) continue;
                        let darkestCol = -1; let minB = 255; let list = [];
                        for (let c = 0; c < sec.cols; c++) {
                            const b = getBrightness((sec.x * 1200 / 100) + (c * secCellW), (sec.y * 1697 / 100) + (r * secCellH), secCellW * 0.7, secCellH * 0.7);
                            list.push(b);
                            if (b < minB) { minB = b; darkestCol = c; }
                        }
                        if ((list.reduce((a,b)=>a+b, 0)/sec.cols) - minB > 20) answers[qIdx] = ['A','B','C','D','E'][darkestCol];
                    }
                });

                let benar = 0;
                answers.forEach((ans, i) => { if(ans === kunci[i] && kunci[i] !== '') benar++; });
                const siswa = siswaDB.find(s => s.kode === rollNo) || { nama: "Tidak Dikenal", kode: rollNo };
                return { kode: rollNo, nama: siswa.nama, benar, skor: ((benar / kunci.filter(k=>k!=='').length) * 100).toFixed(1), jawaban: answers };
            };

            const startBatch = async () => {
                setLoading(true);
                const final = [];
                for(let i = 0; i < files.length; i++) {
                    try {
                        const res = scanMode === 'ai' ? await analyzeWithAI(files[i].id) : await analyzeStandard(files[i].id);
                        final.push(res);
                    } catch (err) {
                        console.error("Gagal memproses file:", files[i].name, err);
                        final.push({ kode: "ERR", nama: files[i].name, benar: 0, skor: "0.0", jawaban: [] });
                    }
                    setProgress(Math.round(((i + 1) / files.length) * 100));
                }
                setResults(final);
                setLoading(false);
                setActiveTab('results');
            };

            const syncToSheets = async () => {
                if(!token || !sheetId) return;
                setLoading(true);
                try {
                    const vals = results.map(r => [r.kode, r.nama, r.skor, r.benar, 40, ...r.jawaban]);
                    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/Sheet1!A2:append?valueInputOption=USER_ENTERED`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ values: vals })
                    });
                    alert("✅ Data Berhasil Dikirim ke Google Sheets!");
                } catch(e) { alert("Gagal mengirim ke Sheets."); }
                setLoading(false);
            };

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar */}
                    <aside className="w-64 bg-indigo-950 text-white p-6 flex flex-col gap-8 shadow-2xl z-20">
                        <div className="flex items-center gap-3">
                            <div className="bg-white p-2 rounded-xl text-indigo-900 shadow-inner">
                                <i data-lucide="scan-face" className="w-6 h-6"></i>
                            </div>
                            <h1 className="font-black text-xl tracking-tighter">SCANNA <span className="text-indigo-400 font-normal">by Umi</span></h1>
                        </div>
                        <nav className="flex flex-col gap-1">
                            {[
                                { id: 'cloud', icon: 'cloud', label: 'Integrasi Cloud' },
                                { id: 'setup', icon: 'key', label: 'Kunci Jawaban' },
                                { id: 'siswa', icon: 'users', label: 'Data Peserta' },
                                { id: 'scan', icon: 'play', label: 'Mulai Koreksi' },
                                { id: 'results', icon: 'file-text', label: 'Hasil Nilai' }
                            ].map(item => (
                                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`flex items-center gap-3 p-3 rounded-xl text-sm font-bold transition-all ${activeTab === item.id ? 'bg-indigo-600 shadow-lg translate-x-1' : 'hover:bg-white/10 opacity-60'}`}>
                                    <i data-lucide={item.icon} className="w-5 h-5"></i> {item.label}
                                </button>
                            ))}
                        </nav>
                        {!token ? (
                            <button onClick={handleLogin} className="mt-auto bg-white text-indigo-950 py-4 rounded-2xl font-black text-sm flex items-center justify-center gap-2 hover:bg-slate-100 transition shadow-xl">
                                <i data-lucide="log-in"></i> LOGIN GOOGLE
                            </button>
                        ) : (
                            <div className="mt-auto p-4 bg-green-500/10 border border-green-500/30 rounded-2xl text-[10px] font-black text-green-500 text-center uppercase tracking-widest">
                                <i data-lucide="check-circle" className="w-3 h-3 inline mr-1"></i> Terhubung
                            </div>
                        )}
                    </aside>

                    {/* Main Area */}
                    <main className="flex-1 bg-slate-50 overflow-y-auto p-8 custom-scrollbar relative">
                        {activeTab === 'cloud' && (
                            <div className="max-w-2xl mx-auto space-y-6">
                                <div className="bg-white p-10 rounded-[3rem] shadow-sm border border-slate-200">
                                    <h2 className="text-2xl font-black mb-8 flex items-center gap-3 text-slate-800">
                                        <i data-lucide="cloud-cog" className="text-indigo-600"></i> Setup Google Workspace
                                    </h2>
                                    <div className="space-y-5">
                                        <div>
                                            <label className="text-[10px] font-black text-slate-400 uppercase ml-2 mb-1 block tracking-widest">ID Folder Google Drive</label>
                                            <input type="text" value={folderId} onChange={e=>setFolderId(e.target.value)} className="w-full p-4 bg-slate-50 border-2 border-transparent focus:border-indigo-600 rounded-2xl outline-none font-bold transition-all" placeholder="ID Folder LJK..." />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-black text-slate-400 uppercase ml-2 mb-1 block tracking-widest">ID Google Spreadsheet</label>
                                            <input type="text" value={sheetId} onChange={e=>setSheetId(e.target.value)} className="w-full p-4 bg-slate-50 border-2 border-transparent focus:border-indigo-600 rounded-2xl outline-none font-bold transition-all" placeholder="ID Spreadsheet Hasil..." />
                                        </div>
                                        <button onClick={fetchFiles} disabled={!token} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-xl hover:bg-indigo-700 disabled:opacity-30 transition-all active:scale-[0.98]">
                                            VALIDASI & MUAT DRIVE
                                        </button>
                                    </div>
                                </div>
                                {files.length > 0 && (
                                    <div className="bg-white p-6 rounded-3xl border border-indigo-100 flex items-center justify-between shadow-sm">
                                        <div>
                                            <p className="font-black text-indigo-900 text-lg">{files.length} Gambar LJK</p>
                                            <p className="text-xs text-slate-400 font-bold uppercase tracking-wider">Tersedia di folder Drive</p>
                                        </div>
                                        <button onClick={() => setActiveTab('scan')} className="bg-indigo-600 text-white px-8 py-3 rounded-xl font-black shadow-lg">LANJUT</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'setup' && (
                            <div className="max-w-4xl mx-auto bg-white p-10 rounded-[3rem] shadow-sm border border-slate-200">
                                <div className="flex justify-between items-center mb-10">
                                    <h2 className="text-2xl font-black text-slate-800">Kunci Jawaban</h2>
                                    <button onClick={() => {
                                        const csv = prompt("Paste Kunci (Misal: A,B,C... atau per baris)");
                                        if(csv) {
                                            const v = csv.split(/[\n,]/).map(x => x.trim().toUpperCase());
                                            setKunci(v.slice(0, 40));
                                            localStorage.setItem('umi_kunci', JSON.stringify(v.slice(0, 40)));
                                        }
                                    }} className="bg-indigo-50 text-indigo-600 px-6 py-2 rounded-xl text-xs font-black hover:bg-indigo-100">IMPORT CSV</button>
                                </div>
                                <div className="grid grid-cols-5 md:grid-cols-10 gap-4">
                                    {kunci.map((k, i) => (
                                        <div key={i} className="flex flex-col gap-1 group">
                                            <span className="text-[10px] text-center font-bold text-slate-300 group-hover:text-indigo-600 transition-colors">{i+1}</span>
                                            <select value={k} onChange={e => {
                                                const n = [...kunci]; n[i] = e.target.value; setKunci(n);
                                                localStorage.setItem('umi_kunci', JSON.stringify(n));
                                            }} className={`p-2 border-2 rounded-xl text-center font-black text-sm appearance-none transition-all ${k ? 'bg-indigo-600 border-indigo-600 text-white shadow-md' : 'bg-slate-50 border-slate-100 text-slate-300'}`}>
                                                <option value="">-</option>
                                                {['A','B','C','D','E'].map(o => <option key={o} value={o}>{o}</option>)}
                                            </select>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'siswa' && (
                            <div className="max-w-2xl mx-auto bg-white p-10 rounded-[3rem] shadow-sm border border-slate-200">
                                <h2 className="text-2xl font-black text-slate-800 mb-4">Database Peserta</h2>
                                <p className="text-xs text-slate-400 mb-6 font-bold uppercase tracking-widest">Format: Kode,Nama (Contoh: 0391,Zakaria Certiano)</p>
                                <textarea 
                                    className="w-full h-80 p-6 bg-slate-50 border-2 border-transparent focus:border-indigo-600 rounded-3xl font-mono text-sm outline-none transition-all"
                                    placeholder="0391,Zakaria Certiano&#10;0392,Ani Wijaya"
                                    defaultValue={siswaDB.map(s => `${s.kode},${s.nama}`).join('\n')}
                                    onBlur={e => {
                                        const d = e.target.value.split('\n').map(l => {
                                            const parts = l.includes(',') ? l.split(',') : l.split('\t');
                                            return { kode: parts[0]?.trim(), nama: parts[1]?.trim() };
                                        }).filter(x=>x.kode && x.nama);
                                        setSiswaDB(d);
                                        localStorage.setItem('umi_siswa', JSON.stringify(d));
                                    }}
                                />
                            </div>
                        )}

                        {activeTab === 'scan' && (
                            <div className="flex flex-col items-center justify-center h-full py-10">
                                <div className="bg-white p-12 rounded-[4rem] shadow-2xl border-4 border-dashed border-slate-100 text-center max-w-lg animate-in zoom-in-95">
                                    <div className="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                                        <i data-lucide={scanMode === 'ai' ? "sparkles" : "zap"} className="w-10 h-10"></i>
                                    </div>
                                    <h2 className="text-3xl font-black mb-2 tracking-tighter text-slate-800 uppercase">Pilih Mode Koreksi</h2>
                                    
                                    <div className="grid grid-cols-2 gap-4 mt-8 mb-10">
                                        <button 
                                            onClick={() => setScanMode('standard')}
                                            className={`p-6 rounded-3xl border-2 transition-all ${scanMode === 'standard' ? 'bg-indigo-600 border-indigo-600 text-white shadow-lg' : 'bg-white border-slate-100 text-slate-400 hover:border-indigo-200'}`}
                                        >
                                            <i data-lucide="zap" className="mx-auto mb-2"></i>
                                            <p className="font-black text-xs uppercase tracking-widest">Fast Scan</p>
                                            <p className="text-[10px] opacity-70">Standar Pixel</p>
                                        </button>
                                        <button 
                                            onClick={() => setScanMode('ai')}
                                            className={`p-6 rounded-3xl border-2 transition-all ai-glow ${scanMode === 'ai' ? 'bg-indigo-600 border-indigo-600 text-white shadow-lg' : 'bg-white border-slate-100 text-slate-400 hover:border-indigo-200'}`}
                                        >
                                            <i data-lucide="sparkles" className="mx-auto mb-2 text-amber-400"></i>
                                            <p className="font-black text-xs uppercase tracking-widest">AI Precision</p>
                                            <p className="text-[10px] opacity-70">Akurasi Tinggi</p>
                                        </button>
                                    </div>

                                    <button onClick={startBatch} disabled={files.length === 0} className="w-full bg-indigo-950 text-white py-5 rounded-[2rem] font-black text-xl shadow-2xl hover:scale-105 active:scale-95 transition-all disabled:opacity-20">
                                        MULAI SCAN ({files.length})
                                    </button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'results' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                                    <div>
                                        <h2 className="text-3xl font-black text-slate-800">{results.length} Data</h2>
                                        <p className="text-xs text-slate-400 font-bold uppercase tracking-widest">Hasil Scan {scanMode.toUpperCase()}</p>
                                    </div>
                                    <button onClick={syncToSheets} className="bg-green-600 text-white px-8 py-3 rounded-2xl font-black shadow-lg hover:bg-green-700 transition-all flex items-center gap-2">
                                        <i data-lucide="file-spreadsheet"></i> KIRIM KE GOOGLE SHEETS
                                    </button>
                                </div>
                                <div className="bg-white rounded-[2.5rem] shadow-sm border overflow-hidden border-slate-200">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 border-b">
                                            <tr className="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                                <th className="p-6">Peserta</th>
                                                <th className="p-6 text-center">B/S</th>
                                                <th className="p-6 text-center">Skor</th>
                                                <th className="p-6">Kode Terbaca</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50">
                                            {results.map((r, i) => (
                                                <tr key={i} className="hover:bg-slate-50/50 transition-colors">
                                                    <td className="p-6">
                                                        <p className="font-black text-slate-800">{r.nama}</p>
                                                        <p className="text-[10px] font-bold text-indigo-400 uppercase tracking-wider">{r.kode === r.nama ? 'Roll No Tidak Terdaftar' : ''}</p>
                                                    </td>
                                                    <td className="p-6 text-center font-bold">
                                                        <span className="text-green-600">{r.benar}</span>
                                                        <span className="text-slate-200 mx-2">/</span>
                                                        <span className="text-red-400 text-xs">{40 - r.benar}</span>
                                                    </td>
                                                    <td className="p-6 text-center">
                                                        <div className="inline-block px-4 py-2 bg-indigo-50 text-indigo-700 rounded-2xl font-black text-sm">{r.skor}</div>
                                                    </td>
                                                    <td className="p-6 font-mono text-sm font-bold text-slate-500">
                                                        {r.kode}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* Loader Overlay */}
                        {loading && (
                            <div className="fixed inset-0 bg-indigo-950/90 backdrop-blur-xl z-[500] flex flex-col items-center justify-center text-white p-6">
                                <div className="relative w-32 h-32 mb-8">
                                    <div className="absolute inset-0 border-8 border-indigo-500/30 rounded-full"></div>
                                    <div className="absolute inset-0 border-8 border-white border-t-transparent rounded-full animate-spin"></div>
                                    <div className="absolute inset-0 flex items-center justify-center font-black text-2xl">{progress}%</div>
                                </div>
                                <h2 className="text-2xl font-black tracking-tight mb-2 uppercase">
                                    {scanMode === 'ai' ? 'AI Sedang Membaca' : 'Scanna Sedang Bekerja'}
                                </h2>
                                <p className="font-bold opacity-40 uppercase text-[10px] tracking-[0.3em]">
                                    {scanMode === 'ai' ? 'Menganalisis Detail Visual LJK...' : 'Menganalisis Detail Arsiran...'}
                                </p>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setTimeout(() => { if(window.lucide) window.lucide.createIcons(); }, 1000);
    </script>
</body>
</html>
